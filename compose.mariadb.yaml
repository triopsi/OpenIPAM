# Standalone MariaDB development variant.
services:
  app:
    build:
      context: .
      target: development
    ports:
      - "127.0.0.1:${APP_PORT:-9080}:8080"
      - "127.0.0.1:${VITE_PORT:-9517}:5173"
    volumes:
      - .:/var/www/html
    environment:
      VITE_PORT: ${VITE_PORT:-9517}
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${APP_PORT:-9080}
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: openipam
      DB_USERNAME: openipam
      DB_PASSWORD: local-development-only
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      QUEUE_CONNECTION: sync
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mariadb:13.0
    environment:
      MARIADB_DATABASE: openipam
      MARIADB_USER: openipam
      MARIADB_PASSWORD: local-development-only
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - database-mariadb:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-9025}:8025"
volumes:
  database-mariadb:
