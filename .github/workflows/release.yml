name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Existing stable release version to republish (without v)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semantic.outputs.published }}
      version: ${{ steps.semantic.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - id: semantic
        run: node .github/scripts/release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  image:
    needs: [checks, release]
    if: always() && needs.checks.result == 'success' && (needs.release.outputs.published == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_VERSION: ${{ inputs.version || needs.release.outputs.version }}
    steps:
      - name: Validate version
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Expected an existing stable release version without v.'
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: v${{ env.RELEASE_VERSION }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker Hub login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image names
        id: names
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          repo="${REPOSITORY,,}"
          {
            echo 'tags<<EOF'
            echo "ghcr.io/$repo:$VERSION"
            echo "ghcr.io/$repo:latest"
            echo "triopsi/openipam:$VERSION"
            echo "triopsi/openipam:latest"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ env.RELEASE_VERSION }}
          tags: ${{ steps.names.outputs.tags }}
          labels: |
            org.opencontainers.image.title=OpenIPAM
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
            org.opencontainers.image.licenses=MIT
