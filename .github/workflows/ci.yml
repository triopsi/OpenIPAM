name: CI
on:
  pull_request:
  push:
    branches: [develop]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: PHP ${{ matrix.php }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, gd, intl, mbstring, pdo_sqlite, zip
          coverage: none
          ini-values: memory_limit=512M
      - run: composer install --no-interaction --prefer-dist
      - run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          vendor/bin/phpunit --log-junit junit.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tests-php-${{ matrix.php }}
          path: junit.xml
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, mbstring, pdo_sqlite, zip
          coverage: none
          ini-values: memory_limit=512M
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/pint --test
      - name: Check PHPUnit test documentation
        run: composer test:docs
      - run: npm ci
      - run: npm run lint-js
      - run: npm run build
      - name: Validate Compose variants
        env:
          APP_KEY: ci-placeholder
          APP_URL: http://localhost:8080
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.mariadb.yaml config --quiet
          docker compose -f compose.production.yaml config --quiet
      - uses: docker://rhysd/actionlint:1.7.12
  databases:
    name: PostgreSQL and MariaDB integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: openipam_test
          POSTGRES_USER: openipam
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432/tcp']
        options: >-
          --health-cmd="pg_isready -U openipam -d openipam_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: openipam_test
          MARIADB_USER: openipam
          MARIADB_PASSWORD: ci-only-password
          MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
        ports: ['3306/tcp']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      APP_ENV: testing
      DB_HOST: 127.0.0.1
      DB_DATABASE: openipam_test
      DB_USERNAME: openipam
      DB_PASSWORD: ci-only-password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, mbstring, pdo_pgsql, pdo_mysql, zip
          coverage: none
          ini-values: memory_limit=512M
      - run: composer install --no-interaction --prefer-dist
      - run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
      - name: PostgreSQL tests and migration rollback
        env:
          DB_CONNECTION: pgsql
          DB_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          vendor/bin/phpunit
          php artisan migrate --force --no-interaction
          php artisan migrate:reset --force --no-interaction
          php artisan migrate --force --no-interaction
      - name: MariaDB tests and migration rollback
        env:
          DB_CONNECTION: mariadb
          DB_PORT: ${{ job.services.mariadb.ports['3306'] }}
        run: |
          vendor/bin/phpunit
          php artisan migrate --force --no-interaction
          php artisan migrate:reset --force --no-interaction
          php artisan migrate --force --no-interaction
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          ini-values: memory_limit=512M
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: composer audit --locked
      - run: npm audit --omit=dev --audit-level=high
  docker:
    name: Production image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          load: true
          tags: openipam:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start image with persistent SQLite storage
        run: |
          docker run -d --name openipam-ci -p 127.0.0.1:8080:8080 \
            -e APP_URL=http://localhost:8080 \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=/var/www/html/storage/database.sqlite \
            -e QUEUE_CONNECTION=sync \
            -v openipam-ci-storage:/var/www/html/storage openipam:ci
          for attempt in $(seq 1 30); do
            echo "Health check $attempt/30"
            if curl -fsS http://localhost:8080/up; then exit 0; fi
            sleep 2
          done
          docker logs openipam-ci
          exit 1
      - name: Verify installer, stored key and restart
        run: |
          curl -fsS http://localhost:8080/admin/register -o /tmp/openipam-installer.html
          grep -q 'Welcome to OpenIPAM' /tmp/openipam-installer.html
          docker exec openipam-ci test -s storage/app.key
          key_hash="$(docker exec openipam-ci sha256sum storage/app.key)"
          docker restart openipam-ci
          for attempt in $(seq 1 30); do
            echo "Restart health check $attempt/30"
            if curl -fsS http://localhost:8080/up; then
              test "$key_hash" = "$(docker exec openipam-ci sha256sum storage/app.key)"
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Show container logs
        if: failure()
        run: docker logs openipam-ci || true
      - name: Stop smoke test
        if: always()
        run: docker rm -f openipam-ci || true
