name: Scheduled security audit
on:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: composer audit --locked
      - run: npm audit --audit-level=high
